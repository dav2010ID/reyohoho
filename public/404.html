<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Google Tag Manager -->
    <script>
      ;(function (w, d, s, l, i) {
        w[l] = w[l] || []
        w[l].push({ 'gtm.start': new Date().getTime(), event: 'gtm.js' })
        var f = d.getElementsByTagName(s)[0],
          j = d.createElement(s),
          dl = l != 'dataLayer' ? '&l=' + l : ''
        j.async = true
        j.src = 'https://www.googletagmanager.com/gtm.js?id=' + i + dl
        f.parentNode.insertBefore(j, f)
      })(window, document, 'script', 'dataLayer', 'GTM-NVWTCVZH')
    </script>
    <!-- End Google Tag Manager -->
    <title>Redirecting...</title>
    <script>
      ;(() => {
        const configuredBasePath = '__BASE_URL__'
        const normalizedBasePath =
          configuredBasePath && configuredBasePath !== '/'
            ? configuredBasePath.replace(/\/$/, '')
            : ''
        const { pathname, search, hash } = window.location

        let appRoute = pathname
        if (normalizedBasePath && pathname.startsWith(normalizedBasePath)) {
          appRoute = pathname.slice(normalizedBasePath.length)
        }

        if (!appRoute.startsWith('/')) {
          appRoute = `/${appRoute}`
        }

        const redirectTarget = `${appRoute}${search}${hash}`
        const destination = `${normalizedBasePath || ''}/?p=${encodeURIComponent(redirectTarget)}`

        window.location.replace(destination)
      })()
    </script>
  </head>
  <body>
    <!-- Google Tag Manager (noscript) -->
    <noscript
      ><iframe
        src="https://www.googletagmanager.com/ns.html?id=GTM-NVWTCVZH"
        height="0"
        width="0"
        style="display: none; visibility: hidden"
      ></iframe
    ></noscript>
    <!-- End Google Tag Manager (noscript) -->
    <p>Redirecting...</p>
  </body>
</html>
