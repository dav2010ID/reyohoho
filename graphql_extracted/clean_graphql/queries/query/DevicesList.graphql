query DevicesList {
  userProfile {
    devices {
      __typename
      ...deviceItemsForUserFragment
      restrictions {
        maxDevices
      }
    }
  }
}

fragment deviceItemsForUserFragment on UserDeviceInfo {
  items(relation: OWN) {
    deviceId
    name
    vendor
    os {
      name
      version
    }
    deviceModel
  }
}
