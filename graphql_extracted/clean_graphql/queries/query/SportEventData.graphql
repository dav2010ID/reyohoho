query SportEventData(
  $sportEventId: String!
  $showcaseId: String!
  $showcaseOffset: Int! = 0
  $showcaseLimit: Int!
  $selectionOffset: Int! = 0
  $selectionLimit: Int!
  $includeUserData: Boolean!
  $purchaseOptionsContext: BillingFeatureClientContextInput!
  $includeMoviePurchaseOptions: Boolean!
  $includeTrialCutInfo: Boolean!
  $includeDeepDiveFlag: Boolean! = true
  $includeSportEventShowcase: Boolean!
  $includeUrl: Boolean!
  $includeSportStatisticSelection: Boolean!
  $includeSportStatisticSelectionUserMeta: Boolean!
  $includeSportWatchingUsersTotalCount: Boolean!
  $includeSportWatchingFriends: Boolean!
  $includeNotificationsSelection: Boolean!
  $filter: SportShowcaseFilterInput
) {
  clientInfo {
    time {
      currentTimeUtc
    }
  }
  sportEvent(sportEventId: $sportEventId) {
    __typename
    ...sportEventMetaFragment
  }
  sportShowcase(id: $showcaseId, filter: $filter)
    @include(if: $includeSportEventShowcase) {
    __typename
    ...sportEventShowcaseFragment
  }
  userProfile @include(if: $includeSportStatisticSelectionUserMeta) {
    __typename
    ...sportContentSettingsFragment
  }
}

fragment imageFragment on Image {
  avatarsUrl
  fallbackUrl
}

fragment movieContentPackageFragment on ContentPackage {
  billingFeatureName
}

fragment sportViewOptionFragment on ViewOption {
  type
  purchasabilityStatus
  contentPackageToBuy {
    __typename
    ...movieContentPackageFragment
  }
  contentPackageToUnfreeze {
    __typename
    ...movieContentPackageFragment
  }
  purchaseOptions(clientContext: $purchaseOptionsContext)
    @include(if: $includeMoviePurchaseOptions) {
    billingFeatureNames
    target
  }
  trialCutInfo @include(if: $includeTrialCutInfo) {
    texts {
      title
      subTitle
      buttonText
    }
    token
    type
  }
  purchaseOptionCustomProperties @include(if: $includeMoviePurchaseOptions)
}

fragment sportBrandingFragment on style {
  __typename
  ... on CoverAndLogoStyle {
    title
    comment
    cover {
      __typename
      ...imageFragment
    }
    squareCover {
      __typename
      ...imageFragment
    }
    logo {
      __typename
      ...imageFragment
    }
  }
  ... on ShieldAndTextStyle {
    icon {
      __typename
      ...imageFragment
    }
    text
    textColor
  }
}

fragment sportWatchingFriendFragment on UserProfileInterface {
  id {
    puid
  }
  social {
    alias {
      defaultValue {
        value
        source
      }
    }
    name {
      defaultValue {
        value
      }
    }
    avatar {
      defaultValue {
        value {
          __typename
          ...imageFragment
        }
      }
    }
  }
}

fragment sportWatchingSocialArgumentFragment on AbstractSportEvent {
  watchingSportSocialArgument {
    usersTotalCount @include(if: $includeSportWatchingUsersTotalCount)
    socialSubscriptionsWatching(limit: 3, offset: 0)
      @include(if: $includeSportWatchingFriends) {
      total
      items {
        __typename
        ...sportWatchingFriendFragment
      }
    }
  }
}

fragment sportEventMetaFragment on AbstractSportEvent {
  __typename
  id
  sportEventId
  title
  comment
  matchStartTime
  startTime
  expirationTime
  endTime
  deepDiveAvailable @include(if: $includeDeepDiveFlag)
  ... on SportTeamsEvent {
    votes {
      firstTeamVotes
      secondTeamVotes
      drawVotes
      userVote @include(if: $includeUserData)
    }
  }
  gallery {
    covers {
      accentRightSquare {
        __typename
        ...imageFragment
      }
      accentRight {
        __typename
        ...imageFragment
      }
    }
    posters {
      accentRightHorizontal {
        __typename
        ...imageFragment
      }
    }
  }
  competition {
    id
    name
    shortName
    sportType {
      name
    }
  }
  viewOption {
    __typename
    ...sportViewOptionFragment
  }
  userData @include(if: $includeUserData) {
    isSubscribedToNotification
  }
  liveMeta {
    __typename
    ... on SportEventLiveMeta {
      stage
    }
    ... on SportTeamsEventLiveMeta {
      stage
      firstTeamScore {
        result
      }
      secondTeamScore {
        result
      }
    }
  }
  style {
    __typename
    ...sportBrandingFragment
  }
  url @include(if: $includeUrl)
  ... on SportTeamsEvent {
    firstTeam {
      id
      name
      logo {
        __typename
        ...imageFragment
      }
    }
    secondTeam {
      id
      name
      logo {
        __typename
        ...imageFragment
      }
    }
  }
  ...sportWatchingSocialArgumentFragment
}

fragment sportShowcaseSelectionPagingMetaFragment on SessionPagingList_SelectionItem {
  offset
  limit
  hasMore
}

fragment sportHighlightSelectionItemFragment on SportHighlightSelectionItem {
  highlight {
    id
    title
    comment
    duration
    gallery {
      covers {
        horizontal {
          __typename
          ...imageFragment
        }
      }
      posters {
        horizontal {
          __typename
          ...imageFragment
        }
        vertical {
          __typename
          ...imageFragment
        }
      }
    }
    viewOption {
      __typename
      ...sportViewOptionFragment
    }
  }
}

fragment sportEventSelectionItemTeamFragment on SportTeam {
  id
  name
  gallery {
    logos {
      main {
        __typename
        ...imageFragment
      }
    }
  }
}

fragment sportEventSelectionItemFragment on SportEventSelectionItem {
  sportEvent {
    __typename
    id
    sportEventId
    title
    comment
    startTime
    endTime
    expirationTime
    deepDiveAvailable @include(if: $includeDeepDiveFlag)
    description
    gallery {
      posters {
        accentRightWithLogo {
          __typename
          ...imageFragment
        }
        announceHorizontal {
          __typename
          ...imageFragment
        }
        liveHorizontal {
          __typename
          ...imageFragment
        }
        recordHorizontal {
          __typename
          ...imageFragment
        }
      }
    }
    competition {
      id
      shortName
      sportType {
        name
      }
    }
    liveMeta {
      __typename
      ... on SportEventLiveMeta {
        stage
      }
      ... on SportTeamsEventLiveMeta {
        stage
        firstTeamScore {
          result
        }
        secondTeamScore {
          result
        }
      }
    }
    viewOption {
      __typename
      ...sportViewOptionFragment
    }
    ... on SportTeamsEvent {
      firstTeam {
        __typename
        ...sportEventSelectionItemTeamFragment
      }
      secondTeam {
        __typename
        ...sportEventSelectionItemTeamFragment
      }
    }
  }
}

fragment sportNotificationSelectionItemFragment on NotificationSelectionItem {
  notification {
    notificationPayloadId
    payload
    templateId
    feedbackToken
  }
}

fragment sportEventShowcaseSelectionFragment on ShowcaseItem {
  __typename
  ... on SportSelection {
    id
    title
    showTitle
    comment
    style {
      __typename
      ...sportBrandingFragment
    }
    content(offset: $selectionOffset, limit: $selectionLimit) {
      __typename
      ...sportShowcaseSelectionPagingMetaFragment
      items {
        __typename
        ...sportHighlightSelectionItemFragment
        ...sportEventSelectionItemFragment
      }
    }
  }
  ... on SportStatisticSelection @include(if: $includeSportStatisticSelection) {
    id
    title
    comment
    item {
      statisticsPayload
    }
  }
  ... on NotificationsSelection @include(if: $includeNotificationsSelection) {
    id
    title
    showTitle
    content(offset: $selectionOffset, limit: $selectionLimit) {
      __typename
      ...sportShowcaseSelectionPagingMetaFragment
      items {
        __typename
        ...sportNotificationSelectionItemFragment
      }
    }
  }
}

fragment sportEventShowcaseFragment on AbstractShowcase {
  id
  content(offset: $showcaseOffset, limit: $showcaseLimit) {
    offset
    limit
    hasMore
    items {
      __typename
      ...sportEventShowcaseSelectionFragment
    }
  }
}

fragment sportContentSettingsFragment on UserProfile {
  __typename
  ... on UserProfile {
    sportContentSettings {
      resultHidden
    }
  }
}
