query Recommendations($offset: Int, $limit: Int) {
  movieListBySlug(slug: "recommendation") {
    movies(offset: $offset, limit: $limit) {
      items {
        movie {
          ...RecommendationMovie
          __typename
        }
        __typename
      }
      __typename
    }
    __typename
  }
}

fragment RatingValue on RatingValue {
  value
  isActive
  count
  __typename
}

fragment RecommendationMovie on Movie {
  id
  title {
    russian
    original
    __typename
  }
  genres {
    id
    name
    __typename
  }
  rating {
    kinopoisk {
      ...RatingValue
      __typename
    }
    __typename
  }
  viewOption {
    buttonText
    isAvailableOnline: isWatchable(
      filter: { anyDevice: false, anyRegion: false }
    )
    purchasabilityStatus
    contentPackageToBuy {
      billingFeatureName
      __typename
    }
    subscriptionBadge {
      image {
        avatarsUrl
        __typename
      }
      __typename
    }
    type
    posterWithRightholderLogo
    __typename
  }
  poster {
    avatarsUrl
    __typename
  }
  ... on Film {
    productionYear
    __typename
  }
  ... on TvSeries {
    releaseYears {
      start
      end
      __typename
    }
    __typename
  }
  ... on MiniSeries {
    releaseYears {
      start
      end
      __typename
    }
    __typename
  }
  ... on Video {
    productionYear
    __typename
  }
  ... on TvShow {
    releaseYears {
      start
      end
      __typename
    }
    __typename
  }
  __typename
}
