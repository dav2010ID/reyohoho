query UserMovieFolders {
  userProfile {
    ...UserId
    userData {
      movieFolders(offset: 0, limit: 20) {
        items {
          ...Folder
          __typename
        }
        total
        __typename
      }
      __typename
    }
    __typename
  }
}

fragment UserId on UserProfileInterface {
  id {
    ottId
    kpId
    puid
    __typename
  }
  __typename
}

fragment Folder on Folder {
  id
  name
  public
  __typename
}
