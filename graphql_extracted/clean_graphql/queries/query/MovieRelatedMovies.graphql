query MovieRelatedMovies(
  $movieId: Long!
  $relatedMoviesLimit: Int = 10
  $withUserData: Boolean = false
) {
  movie(id: $movieId) {
    id
    relatedMovies(
      limit: $relatedMoviesLimit
      type: [
        VERSION
        SPOOFS
        SPOOFED
        SPIN_OFF
        REFERENCES
        REFERENCES_IN
        EDITED_INTO
        EDITED_FROM
      ]
      orderBy: TYPE_POSITION__MOVIE_ID_ASC
    ) {
      total
      items {
        movie {
          id
          title {
            russian
            original
            __typename
          }
          poster {
            avatarsUrl
            __typename
          }
          genres {
            id
            name
            __typename
          }
          rating {
            kinopoisk {
              ...RatingValue
              __typename
            }
            __typename
          }
          userData @include(if: $withUserData) {
            watchStatuses {
              watched {
                value
                __typename
              }
              __typename
            }
            __typename
          }
          viewOption {
            buttonText
            isAvailableOnline: isWatchable(
              filter: { anyDevice: false, anyRegion: false }
            )
            purchasabilityStatus
            contentPackageToBuy {
              billingFeatureName
              __typename
            }
            subscriptionBadge {
              image {
                avatarsUrl
                __typename
              }
              __typename
            }
            type
            posterWithRightholderLogo
            __typename
          }
          __typename
        }
        __typename
      }
      __typename
    }
    __typename
  }
}

fragment RatingValue on RatingValue {
  value
  isActive
  count
  __typename
}
