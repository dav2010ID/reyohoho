query SportTeamsShowcaseSelection(
  $selectionId: String!
  $showcaseId: String!
  $selectionOffset: Int!
  $selectionLimit: Int!
  $purchaseOptionsContext: BillingFeatureClientContextInput!
  $includeMoviePurchaseOptions: Boolean!
  $includeTrialCutInfo: Boolean!
  $includeDeepDiveFlag: Boolean! = true
  $includeNotificationsSelection: Boolean!
) {
  clientInfo {
    __typename
    ...showcaseClientInfoFragment
  }
  sportSelection(id: $selectionId, showcaseId: $showcaseId) {
    __typename
    ...sportTeamShowcaseSelectionFragment
  }
}

fragment showcaseClientInfoFragment on ClientInfo {
  time {
    currentTimeUtc
  }
}

fragment imageFragment on Image {
  avatarsUrl
  fallbackUrl
}

fragment sportBrandingFragment on style {
  __typename
  ... on CoverAndLogoStyle {
    title
    comment
    cover {
      __typename
      ...imageFragment
    }
    squareCover {
      __typename
      ...imageFragment
    }
    logo {
      __typename
      ...imageFragment
    }
  }
  ... on ShieldAndTextStyle {
    icon {
      __typename
      ...imageFragment
    }
    text
    textColor
  }
}

fragment sportShowcaseSelectionPagingMetaFragment on SessionPagingList_SelectionItem {
  offset
  limit
  hasMore
}

fragment movieContentPackageFragment on ContentPackage {
  billingFeatureName
}

fragment sportViewOptionFragment on ViewOption {
  type
  purchasabilityStatus
  contentPackageToBuy {
    __typename
    ...movieContentPackageFragment
  }
  contentPackageToUnfreeze {
    __typename
    ...movieContentPackageFragment
  }
  purchaseOptions(clientContext: $purchaseOptionsContext)
    @include(if: $includeMoviePurchaseOptions) {
    billingFeatureNames
    target
  }
  trialCutInfo @include(if: $includeTrialCutInfo) {
    texts {
      title
      subTitle
      buttonText
    }
    token
    type
  }
  purchaseOptionCustomProperties @include(if: $includeMoviePurchaseOptions)
}

fragment sportHighlightSelectionItemFragment on SportHighlightSelectionItem {
  highlight {
    id
    title
    comment
    duration
    gallery {
      covers {
        horizontal {
          __typename
          ...imageFragment
        }
      }
      posters {
        horizontal {
          __typename
          ...imageFragment
        }
        vertical {
          __typename
          ...imageFragment
        }
      }
    }
    viewOption {
      __typename
      ...sportViewOptionFragment
    }
  }
}

fragment sportEventSelectionItemTeamFragment on SportTeam {
  id
  name
  gallery {
    logos {
      main {
        __typename
        ...imageFragment
      }
    }
  }
}

fragment sportEventSelectionItemFragment on SportEventSelectionItem {
  sportEvent {
    __typename
    id
    sportEventId
    title
    comment
    startTime
    endTime
    expirationTime
    deepDiveAvailable @include(if: $includeDeepDiveFlag)
    description
    gallery {
      posters {
        accentRightWithLogo {
          __typename
          ...imageFragment
        }
        announceHorizontal {
          __typename
          ...imageFragment
        }
        liveHorizontal {
          __typename
          ...imageFragment
        }
        recordHorizontal {
          __typename
          ...imageFragment
        }
      }
    }
    competition {
      id
      shortName
      sportType {
        name
      }
    }
    liveMeta {
      __typename
      ... on SportEventLiveMeta {
        stage
      }
      ... on SportTeamsEventLiveMeta {
        stage
        firstTeamScore {
          result
        }
        secondTeamScore {
          result
        }
      }
    }
    viewOption {
      __typename
      ...sportViewOptionFragment
    }
    ... on SportTeamsEvent {
      firstTeam {
        __typename
        ...sportEventSelectionItemTeamFragment
      }
      secondTeam {
        __typename
        ...sportEventSelectionItemTeamFragment
      }
    }
  }
}

fragment showcaseEditorialSelectionItemFragment on SelectionItem {
  __typename
  ... on EditorialFeatureSelectionItem {
    description
    entityId
    entityKpId
    entityType
    entityName
    itemType
    imageSizeType
    image {
      __typename
      ...imageFragment
    }
  }
}

fragment sportNotificationSelectionItemFragment on NotificationSelectionItem {
  notification {
    notificationPayloadId
    payload
    templateId
    feedbackToken
  }
}

fragment sportTeamShowcaseSelectionFragment on AbstractSelection {
  __typename
  ... on SportSelection {
    id
    title
    showTitle
    comment
    style {
      __typename
      ...sportBrandingFragment
    }
    content(offset: $selectionOffset, limit: $selectionLimit) {
      __typename
      ...sportShowcaseSelectionPagingMetaFragment
      items {
        __typename
        ...sportHighlightSelectionItemFragment
        ...sportEventSelectionItemFragment
      }
    }
  }
  ... on EditorialFeatureSelection {
    id
    title
    showTitle
    comment
    content(offset: $selectionOffset, limit: $selectionLimit) {
      __typename
      ...sportShowcaseSelectionPagingMetaFragment
      items {
        __typename
        ...showcaseEditorialSelectionItemFragment
      }
    }
  }
  ... on NotificationsSelection @include(if: $includeNotificationsSelection) {
    id
    title
    showTitle
    content(offset: $selectionOffset, limit: $selectionLimit) {
      __typename
      ...sportShowcaseSelectionPagingMetaFragment
      items {
        __typename
        ...sportNotificationSelectionItemFragment
      }
    }
  }
}
