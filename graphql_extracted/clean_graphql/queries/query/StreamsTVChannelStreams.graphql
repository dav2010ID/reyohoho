query StreamsTVChannelStreams(
  $contentId: String!
  $includeStartingChannelData: Boolean!
  $includeChannelDataByContentId: Boolean!
  $prerollsSupported: Boolean!
  $prerollsClientFeedbackSupported: Boolean!
  $includeViewOption: Boolean!
) {
  channelDataByContentId: content(contentId: $contentId)
    @include(if: $includeChannelDataByContentId) {
    __typename
    ...streamsTVChannelFragment
  }
  startingChannelData: userProfile @include(if: $includeStartingChannelData) {
    userData {
      startingTvChannel {
        __typename
        ...streamsTVChannelFragment
      }
    }
  }
}

fragment imageFragment on Image {
  avatarsUrl
  fallbackUrl
}

fragment movieStreamsAudioMetaFragment on AudioMeta {
  audioChannelsNumber
  audioGroupId
  forAdult
  language
  languageName
  quality
  qualityName
  studio
  type
  visibleByDefault
}

fragment streamsVideoMetaFragment on VideoMeta {
  bitrate
  codec
  dynamicRange
  framesPerSecond
  height
  width
  label
}

fragment movieStreamsSubtitleMetaFragment on SubtitleMeta {
  forAdult
  language
  languageName
  studio
  type
  visibleByDefault
}

fragment streamsDrmMetaFragment on StreamMeta {
  drmConfig {
    drmServers {
      certificateUrl
      name
      processSPCPath
      provisioningUrl
      url
    }
    headers
    requestParams
  }
}

fragment streamsMetaFragment on StreamMeta {
  __typename
  audioMetas {
    __typename
    ...movieStreamsAudioMetaFragment
  }
  cuesUrl
  videoMetas {
    __typename
    ...streamsVideoMetaFragment
  }
  subtitleMetas {
    __typename
    ...movieStreamsSubtitleMetaFragment
  }
  prerollsDuration
  prerolls {
    durationMs
    promotedEntityId
    sourceMeta {
      __typename
      ... on PrerollNotificationMeta {
        communicationId
        notificationId
        feedbackToken
      }
    }
  }
  videoToken
  clearStreamEncoding
  ...streamsDrmMetaFragment
  skippableFragments {
    endTime
    final
    startTime
    type
  }
  trackings
  disclaimers {
    type
  }
}

fragment streamsStreamItemFragment on Stream {
  drmType
  streamType
  uri
  videoDescriptorName
  streamMeta {
    __typename
    ...streamsMetaFragment
  }
}

fragment streamsOnlineStreamsFragment on OnlineStreams {
  concurrencyArbiterConfig {
    concurrencyArbiterRequestParams
    server
  }
  drmRequirement
  monetizationModel
  playerRestrictionConfig {
    dvrSeconds
    subtitlesButtonEnable
  }
  sessionId
  streams {
    __typename
    ...streamsStreamItemFragment
  }
}

fragment movieViewOptionTrialCutInfoFragment on TrialCutInfo {
  texts {
    title
    subTitle
    buttonText
  }
  token
  type
}

fragment streamsTVChannelFragment on TvChannel {
  ageRestriction
  contentId
  gallery {
    logos {
      main {
        __typename
        ...imageFragment
      }
    }
  }
  isMultiplex
  isNeedToHidePrograms
  onlineStreams(
    prerollsSupported: $prerollsSupported
    prerollsClientFeedbackSupported: $prerollsClientFeedbackSupported
  ) {
    __typename
    ...streamsOnlineStreamsFragment
  }
  viewOption @include(if: $includeViewOption) {
    trialCutInfo {
      __typename
      ...movieViewOptionTrialCutInfoFragment
    }
  }
  title
  slug
}
