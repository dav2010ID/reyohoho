query MovieDetailsMobileGeneralMetaByOttId(
  $contentUuid: String!
  $includeKpValues: Boolean!
  $isOnlyOnlineSeasonsCount: Boolean!
  $includeMovieTop250: Boolean!
) {
  movieByContentUuid(contentUuid: $contentUuid) {
    __typename
    ...movieDetailsMobileGeneralMetaFragment
    ...movieDetailsMobileGeneralMetaKpValuesFragment
      @include(if: $includeKpValues)
  }
}

fragment imageFragment on Image {
  avatarsUrl
  fallbackUrl
}

fragment baseMoviePostersFragment on MoviePosters {
  vertical(override: OTT_WHEN_EXISTS) {
    __typename
    ...imageFragment
  }
  verticalWithRightholderLogo {
    __typename
    ...imageFragment
  }
  horizontal {
    __typename
    ...imageFragment
  }
  horizontalWithRightholderLogo {
    __typename
    ...imageFragment
  }
}

fragment imageWithSizeFragment on Image {
  __typename
  ...imageFragment
  origSize {
    width
    height
  }
}

fragment ottTrailerFragment on OttTrailer {
  contentGroupUuid
  main
  promo
  streamUrl
}

fragment titleFragment on Title {
  localized
  original
}

fragment genreFragment on Genre {
  id
  name
}

fragment countryFragment on Country {
  id
  name
}

fragment restrictionFragment on Restriction {
  age
  mpaa
}

fragment movieTopsFragment on Movie {
  ratingLists {
    top10 {
      position
      movieListSlug
    }
    top250 @include(if: $includeMovieTop250) {
      position
      movieListSlug
    }
  }
}

fragment movieYearsFragment on Movie {
  __typename
  ... on VideoInterface {
    productionYear(override: OTT_WHEN_EXISTS)
  }
  ... on Series {
    fallbackYear: productionYear
    releaseYears {
      start
      end
    }
  }
}

fragment movieDurationFragment on Movie {
  ott {
    preview {
      __typename
      ... on OttPreview_AbstractVideo {
        duration
      }
    }
  }
}

fragment movieDetailsMobileGeneralMetaFragment on Movie {
  __typename
  id
  contentId
  url
  gallery {
    posters {
      __typename
      ...baseMoviePostersFragment
    }
    covers {
      horizontal {
        __typename
        ...imageFragment
      }
    }
    logos {
      horizontal {
        __typename
        ...imageWithSizeFragment
      }
      rightholderForPoster {
        __typename
        ...imageFragment
      }
      rightholderForCover(filter: { formFactor: M, theme: LIGHT }) {
        image {
          __typename
          ...imageFragment
        }
      }
      rightholderForCoverRecommendedTheme
    }
  }
  ott {
    trailers(limit: 10) {
      items {
        __typename
        ...ottTrailerFragment
      }
    }
  }
  title {
    __typename
    ...titleFragment
  }
  genres {
    __typename
    ...genreFragment
  }
  countries {
    __typename
    ...countryFragment
  }
  restriction {
    __typename
    ...restrictionFragment
  }
  ...movieTopsFragment
  shortDescription
  editorAnnotation
  synopsis(override: OTT_WHEN_EXISTS)
  ...movieYearsFragment
  ...movieDurationFragment
  ... on Series {
    seasons(offset: 0, limit: 0, isOnlyOnline: $isOnlyOnlineSeasonsCount) {
      total
    }
    episodes(offset: 0, limit: 0, isOnlyOnline: $isOnlyOnlineSeasonsCount) {
      total
    }
  }
}

fragment movieDetailsMobileGeneralMetaKpValuesFragment on Movie {
  __typename
  gallery {
    posters {
      kpVertical: vertical(override: DISABLED) {
        __typename
        ...imageFragment
      }
    }
  }
  kpSynopsis: synopsis(override: DISABLED)
  ... on VideoInterface {
    kpYear: productionYear(override: DISABLED)
    kpDuration: duration
  }
}
