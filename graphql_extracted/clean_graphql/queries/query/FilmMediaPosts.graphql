query FilmMediaPosts($filmId: Long!, $mediaPostsLimit: Int = 10) {
  film(id: $filmId) {
    id
    mediaPosts: post(limit: $mediaPostsLimit) {
      items {
        id
        title
        commentsCount
        publishedAt
        commentable
        type
        thumbImage {
          avatarsUrl
          fallbackUrl
          __typename
        }
        __typename
      }
      total
      __typename
    }
    __typename
  }
}
