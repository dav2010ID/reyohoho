query MovieDetailsByContentUuid(
  $contentUuid: String!
  $countryId: Long!
  $sequelsAndPrequelsLimit: Int!
  $relatedMoviesLimit: Int!
  $actorsLimit: Int!
  $trailersLimit: Int!
  $creatorsPerGroupLimit: Int!
  $otherRoles: [MovieCrewRoleSlug!]!
  $imagesPerGroupLimit: Int!
  $factsLimit: Int!
  $bloopersLimit: Int!
  $criticReviewsLimit: Int!
  $userReviewsLimit: Int!
  $userRecommendationMoviesLimit: Int!
  $postsLimit: Int!
  $premieresLimit: Int!
  $isAppendUserData: Boolean!
  $isInternationalUserData: Boolean!
  $movieListsLimit: Int!
  $sequelsAndPrequelsRelationsOrder: [RelatedMovieType!]!
  $relatedMoviesRelationsOrder: [RelatedMovieType!]!
  $friendsVotesLimit: Int!
  $friendsVotesOffset: Int! = 0
  $includeMovieRating: Boolean!
  $isInternational: Boolean!
  $skipTrailers: Boolean!
  $isOnlyOnlineSeriesInfo: Boolean!
  $includeMovieDirectors: Boolean!
  $purchaseOptionsContext: BillingFeatureClientContextInput!
  $includeMoviePurchaseOptions: Boolean!
  $similarMoviesLimit: Int!
  $includeSimilarMovies: Boolean!
  $includeEmotion: Boolean!
  $includeExternalViewOptions: Boolean!
  $includeSocialArgument: Boolean!
  $includeVerification: Boolean!
  $includeKinopoiskRating: Boolean!
  $includeEstEarlyAccess: Boolean!
) {
  movieByContentUuid(contentUuid: $contentUuid) {
    __typename
    ...movieDetailsFragment
  }
  clientInfo {
    __typename
    time {
      __typename
      currentTimeUtc
    }
  }
}

fragment movieDetailsFragment on Movie {
  __typename
  id
  contentId
  url
  userData @include(if: $isAppendUserData) {
    __typename
    ...movieFullUserDataFragment
  }
  editorAnnotation
  gallery {
    __typename
    posters {
      __typename
      ...moviePostersFragment
      kpVertical: vertical(override: DISABLED) @skip(if: $isInternational) {
        __typename
        ...imageFragment
      }
    }
    covers {
      __typename
      square {
        __typename
        ...imageFragment
      }
      horizontal {
        __typename
        ...imageFragment
      }
    }
    logos {
      __typename
      rightholderForPoster {
        __typename
        ...imageFragment
      }
      rightholderForCover(filter: { formFactor: S, theme: LIGHT }) {
        __typename
        image {
          __typename
          ...imageFragment
        }
      }
    }
  }
  ...movieLogoFragment
  rating {
    __typename
    ...ratingFragment @include(if: $includeKinopoiskRating)
    ...fullRatingFragment @skip(if: $isInternational)
  }
  title {
    __typename
    ...titleFragment
  }
  ...movieDetailsImagesFragment @skip(if: $isInternational)
  viewOption {
    __typename
    ...viewOptionDetailedFragment
  }
  releaseOptions {
    __typename
    ...movieReleaseOptionsFragment
  }
  ...movieDetailsCreatorsFragment @skip(if: $isInternational)
  countries {
    __typename
    ...countryFragment
  }
  ...movieDetailsDurationFragment
  genres {
    __typename
    ...genreFragment
  }
  restriction {
    __typename
    ...restrictionFragment
  }
  distribution @skip(if: $isInternational) {
    __typename
    ...distributionFragment
  }
  ticketOption @skip(if: $isInternational) {
    __typename
    purchasable
    releaseAnnounce {
      __typename
      available
      releaseDate {
        __typename
        ...incompleteDateFragment
      }
    }
  }
  externalViewOptions @include(if: $includeExternalViewOptions) {
    __typename
    ...movieExternalViewOptionFragment
  }
  kpSynopsis: synopsis(override: DISABLED) @skip(if: $isInternational)
  ottSynopsis: synopsis(override: OTT_WHEN_EXISTS)
  shortDescription
  ...movieDetailsActorsFragment
  mainTrailer @skip(if: $skipTrailers) {
    __typename
    ...trailerFragment
  }
  trailers(limit: $trailersLimit, orderBy: IS_MAIN_MAKE_DATE_DESC)
    @skip(if: $skipTrailers) {
    __typename
    total
    limit
    items {
      __typename
      ...trailerFragment
    }
  }
  facts: trivias(type: FACT, limit: $factsLimit) @skip(if: $isInternational) {
    __typename
    total
    limit
    items {
      __typename
      ...triviaFragment
    }
  }
  bloopers: trivias(type: BLOOPER, limit: $bloopersLimit)
    @skip(if: $isInternational) {
    __typename
    total
    limit
    items {
      __typename
      ...triviaFragment
    }
  }
  ...movieTopsFragment
  ...directorMoviesInfoFragment @include(if: $includeMovieDirectors)
  ...movieDetailsSequelsAndPrequelsFragment @skip(if: $isInternational)
  ...movieDetailsRelatedMoviesFragment @skip(if: $isInternational)
  ...movieOttFragment
  ...movieOttTrailersFragment
  ...movieYearsFragment
  ... on VideoInterface @skip(if: $isInternational) {
    kpYear: productionYear(override: DISABLED)
  }
  ...movieEpisodesFragment
  posts: post(mainOnly: true, limit: $postsLimit) @skip(if: $isInternational) {
    __typename
    total
    limit
    items {
      __typename
      ...postFragment
    }
  }
  ...reviewsFragment @skip(if: $isInternational)
  ...movieDetailsAwardsFragment @skip(if: $isInternational)
  dvdSales @skip(if: $isInternational) {
    __typename
    totalAmount {
      __typename
      ...moneyAmountFragment
    }
  }
  boxOffice @skip(if: $isInternational) {
    __typename
    budget {
      __typename
      ...moneyAmountFragment
    }
    marketing {
      __typename
      ...moneyAmountFragment
    }
    rusBox {
      __typename
      ...moneyAmountFragment
    }
    usaBox {
      __typename
      ...moneyAmountFragment
    }
    worldBox {
      __typename
      ...moneyAmountFragment
    }
  }
  userRecommendations(limit: $userRecommendationMoviesLimit)
    @skip(if: $isInternational) {
    __typename
    total
    items {
      __typename
      movie {
        __typename
        ...movieSummaryFragment
      }
    }
  }
  similarMovies(
    limit: $similarMoviesLimit
    filter: { availability: AVAILABLE_ONLINE }
  ) @include(if: $includeSimilarMovies) {
    __typename
    hasMore
    items {
      __typename
      movie {
        __typename
        ...movieSummaryFragment
      }
    }
  }
  movieLists(limit: $movieListsLimit) @skip(if: $isInternational) {
    __typename
    total
    limit
    items {
      __typename
      ...movieListRelationFragment
    }
  }
}

