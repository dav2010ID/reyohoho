query MovieMobileDetailsUsersReviews(
  $movieId: Long!
  $types: [UserReviewType!]!
  $offset: Int!
  $limit: Int!
  $includeMovieUserData: Boolean!
) {
  movie(id: $movieId) {
    userReviews(
      types: $types
      offset: $offset
      limit: $limit
      orderBy: TOP_USEFULNESS_THEN_CREATED_AT_DESC
    ) {
      offset
      limit
      total
      items {
        __typename
        ...movieUserReviewFragment
      }
    }
  }
}

fragment imageFragment on Image {
  avatarsUrl
  fallbackUrl
}

fragment movieUserReviewFragment on UserReview {
  id
  title
  text
  createdAt
  type
  author {
    id
    login
    avatar {
      __typename
      ...imageFragment
    }
  }
  votes {
    positiveCount
    negativeCount
  }
  userData @include(if: $includeMovieUserData) {
    __typename
    ... on UserReviewUserData {
      voting
    }
  }
}
