query PersonalContentMobileMainData(
  $includePurchases: Boolean!
  $includeFolders: Boolean!
  $includeMovieRating: Boolean!
  $includeQueryWatchLaterSelection: Boolean!
  $includeUserPlannedToWatch: Boolean!
  $includeWatchingHistory: Boolean!
  $plannedToWatchMoviesLimit: Int!
  $movieFoldersLimit: Int!
  $personFoldersLimit: Int!
  $purchasesLimit: Int!
  $watchingHistoryLimit: Int!
  $includePlannedToWatchRating: Boolean! = false
  $purchaseOptionsContext: BillingFeatureClientContextInput!
  $includeMoviePurchaseOptions: Boolean!
  $includeTrialCutInfo: Boolean!
) {
  watchLaterSelection(filter: { purchasedType: ANY })
    @include(if: $includeQueryWatchLaterSelection) {
    content(offset: 0, limit: $plannedToWatchMoviesLimit) {
      limit
      hasMore
      offset
      items {
        __typename
        ... on AbstractMovieSelectionItem {
          movie {
            __typename
            ...personalContentMobileMovieFragment
          }
        }
      }
    }
  }
  userProfile {
    userData {
      plannedToWatch @include(if: $includeUserPlannedToWatch) {
        movies(limit: $plannedToWatchMoviesLimit) {
          limit
          total
          items {
            movie {
              __typename
              ...personalContentMobileMovieFragment
            }
          }
        }
      }
      favorite @include(if: $includeFolders) {
        __typename
        ...favoriteMobileMoviesFragment
      }
      note @include(if: $includeFolders) {
        movies(limit: 3) {
          limit
          total
          items {
            movie {
              gallery {
                posters {
                  __typename
                  ...moviePostersFragment
                }
              }
            }
          }
        }
      }
      movieFolders(limit: $movieFoldersLimit) @include(if: $includeFolders) {
        limit
        total
        items {
          __typename
          ...personalContentMobileMovieFolderFragment
        }
      }
      personFolders(limit: $personFoldersLimit) @include(if: $includeFolders) {
        limit
        total
        items {
          __typename
          ...personalContentMobilePersonFolderFragment
        }
      }
    }
    purchases(limit: $purchasesLimit) @include(if: $includePurchases) {
      currentCursor
      nextCursor
      hasMore
      limit
      items {
        __typename
        ...purchaseItemFragment
      }
    }
    watchingHistory(limit: $watchingHistoryLimit)
      @include(if: $includeWatchingHistory) {
      currentCursor
      nextCursor
      hasMore
      limit
      items {
        __typename
        ...personalContentWatchingHistoryItemFragment
      }
    }
  }
}

fragment imageFragment on Image {
  avatarsUrl
  fallbackUrl
}

fragment baseMoviePostersFragment on MoviePosters {
  vertical(override: OTT_WHEN_EXISTS) {
    __typename
    ...imageFragment
  }
  verticalWithRightholderLogo {
    __typename
    ...imageFragment
  }
  horizontal {
    __typename
    ...imageFragment
  }
  horizontalWithRightholderLogo {
    __typename
    ...imageFragment
  }
}

fragment movieIntroPostersFragment on MoviePosters {
  verticalIntro {
    __typename
    ...imageFragment
  }
  verticalIntroWithRightholderLogo {
    __typename
    ...imageFragment
  }
  horizontalIntro {
    __typename
    ...imageFragment
  }
  horizontalIntroWithRightholderLogo {
    __typename
    ...imageFragment
  }
}

fragment moviePostersFragment on MoviePosters {
  __typename
  ...baseMoviePostersFragment
  ...movieIntroPostersFragment
}

fragment ratingValueFragment on RatingValue {
  isActive
  count
  value(precision: 1)
}

fragment ratingFragment on Rating {
  kinopoisk {
    __typename
    ...ratingValueFragment
  }
  plannedToWatch @include(if: $includePlannedToWatchRating) {
    __typename
    ...ratingValueFragment
  }
}

fragment titleFragment on Title {
  localized
  original
}

fragment genreFragment on Genre {
  id
  name
}

fragment personalContentMobileMovieFragment on Movie {
  id
  contentId
  gallery {
    posters {
      __typename
      ...moviePostersFragment
    }
  }
  rating @include(if: $includeMovieRating) {
    __typename
    ...ratingFragment
  }
  title {
    __typename
    ...titleFragment
  }
  genres {
    __typename
    ...genreFragment
  }
}

fragment favoriteMobileMoviesFragment on FavoriteMovies {
  public
  movies(limit: 3) {
    limit
    total
    items {
      movie {
        gallery {
          posters {
            __typename
            ...moviePostersFragment
          }
        }
      }
    }
  }
}

fragment movieFolderFragment on Folder {
  id
  name
  public
}

fragment personalContentMobileMovieFolderFragment on Folder {
  __typename
  ...movieFolderFragment
  movies(limit: 3) {
    total
    items {
      movie {
        gallery {
          posters {
            __typename
            ...moviePostersFragment
          }
        }
      }
    }
  }
}

fragment personFolderFragment on PersonFolder {
  id: typeId
  name
  public
}

fragment personalContentMobilePersonFolderFragment on PersonFolder {
  __typename
  ...personFolderFragment
  persons(limit: 3) {
    total
    items {
      person {
        poster {
          __typename
          ...imageFragment
        }
      }
    }
  }
}

fragment movieWatchPeriodFragment on WatchPeriod {
  timeToExpire
  watchPeriodStatus
}

fragment purchaseMetadataFragment on PurchaseMetadata {
  id
  createdAt
  monetizationModel
  watchPeriod {
    __typename
    ...movieWatchPeriodFragment
  }
}

fragment movieViewOptionPurchasedSubscriptionFragment on ViewOption {
  purchasedSubscriptionTextId
  purchasedSubscriptionName
}

fragment availabilityAnnounceFragment on AvailabilityAnnounce {
  announcePromise
  availabilityDate
  type
}

fragment movieContentPackageFragment on ContentPackage {
  billingFeatureName
}

fragment currencyFragment on Currency {
  symbol
  currencyCode
}

fragment moneyAmountFragment on MoneyAmount {
  amount
  currency {
    __typename
    ...currencyFragment
  }
}

fragment movieViewOptionTrialCutInfoFragment on TrialCutInfo {
  texts {
    title
    subTitle
    buttonText
  }
  token
  type
}

fragment movieViewOptionSummaryFragment on ViewOption {
  __typename
  type
  purchasabilityStatus
  isWatchableOnDeviceInCurrentRegion: isWatchable(
    filter: { anyDevice: false, anyRegion: false }
  )
  buttonText
  ...movieViewOptionPurchasedSubscriptionFragment
  availabilityAnnounce {
    __typename
    ...availabilityAnnounceFragment
  }
  contentPackageToBuy {
    __typename
    ...movieContentPackageFragment
  }
  contentPackageToUnfreeze {
    __typename
    ...movieContentPackageFragment
  }
  transactionalPrice {
    __typename
    ...moneyAmountFragment
  }
  transactionalMinimumPrice {
    __typename
    ...moneyAmountFragment
  }
  priceWithTotalDiscount {
    __typename
    ...moneyAmountFragment
  }
  optionMonetizationModels
  watchabilityStatus
  watchabilityExpirationTime
  promotionActionType
  downloadabilityStatus
  purchaseOptions(clientContext: $purchaseOptionsContext)
    @include(if: $includeMoviePurchaseOptions) {
    billingFeatureNames
    target
  }
  trialCutInfo @include(if: $includeTrialCutInfo) {
    __typename
    ...movieViewOptionTrialCutInfoFragment
  }
  purchaseOptionCustomProperties @include(if: $includeMoviePurchaseOptions)
}

fragment purchaseItemFragment on PurchaseListItem {
  purchaseMetadata {
    __typename
    ...purchaseMetadataFragment
  }
  purchasedContent {
    __typename
    ...personalContentMobileMovieFragment
    ... on Movie {
      viewOption {
        __typename
        ...movieViewOptionSummaryFragment
      }
      editorAnnotation
    }
  }
}

fragment personalContentWatchingHistoryItemFragment on WatchingHistoryItem {
  date
  entity {
    __typename
    ... on Film {
      id
      contentId
      url
      gallery {
        covers {
          horizontal {
            __typename
            ...imageFragment
          }
        }
      }
      title {
        __typename
        ...titleFragment
      }
      editorAnnotation
      ott {
        preview {
          __typename
          ... on OttPreview_AbstractVideo {
            duration
            timing {
              current
            }
          }
        }
      }
      viewOption {
        __typename
        ...movieViewOptionSummaryFragment
        watchPeriod {
          __typename
          ...movieWatchPeriodFragment
        }
      }
    }
    ... on Episode {
      contentId
      cover {
        __typename
        ...imageFragment
      }
      ottEpisode: ott {
        duration
        timing {
          current
        }
        editorAnnotation
        viewOption {
          availabilityEndDate
          disabled
        }
      }
      number
      season {
        number
      }
      tvSeries {
        contentId
        title {
          __typename
          ...titleFragment
        }
        viewOption {
          __typename
          watchPeriod {
            __typename
            ...movieWatchPeriodFragment
          }
          ...movieViewOptionSummaryFragment
        }
      }
    }
  }
}
