query PersonDetails(
  $personId: Long!
  $onlineMoviesLimit: Int!
  $imagesPerGroupLimit: Int!
  $mainRolesLimit: Int!
  $sitesLimit: Int!
  $triviasLimit: Int!
  $postsLimit: Int!
  $bestMoviesPerGroupLimit: Int!
  $includeMovieRating: Boolean!
  $includeSocialInfo: Boolean!
) {
  person(id: $personId) {
    __typename
    id
    name
    originalName
    dateOfBirth {
      __typename
      ...incompleteDateFragment
    }
    dateOfDeath {
      __typename
      ...incompleteDateFragment
    }
    poster {
      __typename
      ...imageFragment
    }
    age
    gender
    height
    url
    birthPlace
    deathPlace
    mainGenres {
      __typename
      ...genreFragment
    }
    zodiacSign {
      __typename
      title {
        __typename
        russian
      }
    }
    ...personMarriagesFragment
    ...personDetailsImagesFragment
    ...personCareerRolesFragment
    ...personDetailsSitesFragment
    ...personDetailsFilmographySummaryFragment
    onlineFilmography: filmographyRelations(
      isOnline: true
      limit: $onlineMoviesLimit
      orderBy: YEAR_DESC
    ) {
      __typename
      total
      items {
        __typename
        movie {
          __typename
          ...movieSummaryFragment
        }
      }
    }
    ...personSocialInfoFragment @include(if: $includeSocialInfo)
    ...personDetailsBestMoviesFragment
    ...personDetailsAwardsFragment
    ...personDetailsTriviasFragment
    ...personDetailsPostsFragment
    ...personFilmographyRolesFragment
  }
}

fragment personMarriagesFragment on Person {
  __typename
  marriages {
    __typename
    children
    spouse {
      __typename
      ...personSummaryFragment
    }
    status
  }
}

fragment personDetailsImagesFragment on Person {
  __typename
  filteredImagesTotal: images(types: [PHOTO, EVENT], offset: 0, limit: 0) {
    __typename
    total
  }
  filteredImagesPhoto: images(
    types: [PHOTO]
    offset: 0
    limit: $imagesPerGroupLimit
  ) {
    __typename
    ...personImagesCollectionFragment
  }
  filteredImagesEvent: images(
    types: [EVENT]
    offset: 0
    limit: $imagesPerGroupLimit
  ) {
    __typename
    ...personImagesCollectionFragment
  }
}

fragment personCareerRolesFragment on Person {
  __typename
  roles(isCareer: true, limit: $mainRolesLimit) {
    __typename
    ...personRolesPagingListFragment
  }
}

fragment personDetailsSitesFragment on Person {
  __typename
  sites(limit: $sitesLimit) {
    __typename
    items {
      __typename
      type
      url
    }
  }
}

fragment personDetailsFilmographySummaryFragment on Person {
  __typename
  filmographyYears {
    __typename
    start
    end
  }
  filmographyRelations {
    __typename
    total
  }
}

fragment personSocialInfoFragment on Person {
  __typename
  userProfile {
    __typename
    id {
      __typename
      puid
    }
    subscriptionInfo {
      __typename
      hasSubscription
    }
    social {
      __typename
      publicStatus
      url
      name {
        __typename
        defaultValue {
          __typename
          value
        }
      }
      avatar {
        __typename
        defaultValue {
          __typename
          value {
            __typename
            ...imageFragment
          }
        }
      }
      alias {
        __typename
        defaultValue {
          __typename
          value
          source
        }
      }
      badges {
        __typename
        verified {
          __typename
          id
          icons {
            __typename
            format
            image {
              __typename
              ...imageFragment
            }
          }
          title
          description
        }
      }
      isSubscribedTo
      isSubscriptionRequestSentTo
      subscribers(limit: 0, offset: 0) {
        __typename
        total
      }
    }
  }
}

fragment personDetailsBestMoviesFragment on Person {
  __typename
  bestFilms: bestMovies(type: FILM, limit: $bestMoviesPerGroupLimit) {
    __typename
    ...personDetailsBestMoviesFilmographyFragment
  }
  bestSeries: bestMovies(type: SERIES, limit: $bestMoviesPerGroupLimit) {
    __typename
    ...personDetailsBestMoviesFilmographyFragment
  }
}

fragment personDetailsAwardsFragment on Person {
  __typename
  mainAwardsInfo: awards(
    offset: 0
    limit: 1
    isMain: true
    orderBy: WIN_FIRST_YEAR_DESC_NOMINATION_ASC
  ) {
    __typename
    total
    items {
      __typename
      ...personAwardNomineeFragment
    }
  }
  mainAndWinAwardsInfo: awards(
    offset: 0
    limit: 1
    isMain: true
    isWin: true
    orderBy: WIN_FIRST_YEAR_DESC_NOMINATION_ASC
  ) {
    __typename
    total
  }
  allAwardsInfo: awards(
    offset: 0
    limit: 0
    orderBy: WIN_FIRST_YEAR_DESC_NOMINATION_ASC
  ) {
    __typename
    total
  }
}

fragment personDetailsTriviasFragment on Person {
  __typename
  facts: trivias(limit: $triviasLimit) {
    __typename
    total
    limit
    items {
      __typename
      ...triviaFragment
    }
  }
}

fragment personDetailsPostsFragment on Person {
  __typename
  posts: post(mainOnly: true, limit: $postsLimit) {
    __typename
    total
    limit
    items {
      __typename
      ...postFragment
    }
  }
}

fragment personFilmographyRolesFragment on Person {
  __typename
  personFilmographyRolesTotal: roles(isCareer: false, limit: 0) {
    __typename
    total
  }
  firstPage: roles(isCareer: false, limit: 10, orderBy: MOVIES_COUNT_DESC) {
    __typename
    ...personRolesPagingListFragment
  }
  secondPage: roles(
    isCareer: false
    offset: 10
    limit: 10
    orderBy: MOVIES_COUNT_DESC
  ) {
    __typename
    ...personRolesPagingListFragment
  }
}

fragment personSummaryFragment on Person {
  __typename
  id
  name
  gender
  originalName
  dateOfBirth {
    __typename
    ...incompleteDateFragment
  }
  dateOfDeath {
    __typename
    ...incompleteDateFragment
  }
  age
  poster {
    __typename
    ...imageFragment
  }
  published
}

fragment incompleteDateFragment on IncompleteDate {
  __typename
  date
  accuracy
}

fragment imageFragment on Image {
  __typename
  avatarsUrl
  fallbackUrl
}

fragment personImagesCollectionFragment on PagingList_PersonImage {
  __typename
  total
  offset
  limit
  items {
    __typename
    ...personImageFragment
  }
}

fragment personImageFragment on PersonImage {
  __typename
  type
  image {
    __typename
    ...imageFragment
    origSize {
      __typename
      width
      height
    }
  }
}

fragment personRolesPagingListFragment on PagingList_PersonMovieCrewRoleRelation {
  __typename
  items {
    __typename
    role {
      __typename
      ...personRoleFragment
    }
    movies {
      __typename
      total
    }
  }
}

fragment personRoleFragment on MovieCrewRole {
  __typename
  slug
  title {
    __typename
    russian
  }
}

fragment personDetailsBestMoviesFilmographyFragment on PagingList_PersonBestMovie {
  __typename
  items {
    __typename
    movie {
      __typename
      ...movieSummaryFragment
    }
  }
}

fragment movieSummaryFragment on Movie {
  __typename
  id
  gallery {
    __typename
    posters {
      __typename
      ...moviePostersFragment
    }
  }
  genres {
    __typename
    ...genreFragment
  }
  title {
    __typename
    ...titleFragment
  }
  rating @include(if: $includeMovieRating) {
    __typename
    ...ratingFragment
  }
}

fragment genreFragment on Genre {
  __typename
  name
}

fragment titleFragment on Title {
  __typename
  localized
  original
}

fragment ratingFragment on Rating {
  __typename
  kinopoisk {
    __typename
    ...ratingValueFragment
  }
}

fragment ratingValueFragment on RatingValue {
  __typename
  isActive
  count
  value(precision: 1)
}

fragment moviePostersFragment on MoviePosters {
  __typename
  vertical(override: OTT_WHEN_EXISTS) {
    __typename
    ...imageFragment
  }
  verticalWithRightholderLogo {
    __typename
    ...imageFragment
  }
}

fragment personAwardNomineeFragment on PersonAwardNominee {
  __typename
  nomination {
    __typename
    ...nominationFragment
  }
  win
  awardImage: image {
    __typename
    ...imageFragment
  }
  movie {
    __typename
    ...movieSummaryFragment
  }
}

fragment nominationFragment on AwardNomination {
  __typename
  title
  award {
    __typename
    ...awardFragment
  }
}

fragment awardFragment on Award {
  __typename
  title
  year
}

fragment triviaFragment on Trivia {
  __typename
  id
  isSpoiler
  text
  type
}

fragment postFragment on Post {
  __typename
  id
  title
  publishedAt
  coverImage {
    __typename
    ...imageFragment
  }
  thumbImage {
    __typename
    ...imageFragment
  }
}
