query FilmTrivias(
  $filmId: Long!
  $triviasType: TriviaType!
  $triviasLimit: Int = 10
  $triviasOffset: Int = 0
) {
  film(id: $filmId) {
    id
    trivias(type: $triviasType, limit: $triviasLimit, offset: $triviasOffset) {
      items {
        id
        isSpoiler
        text
        type
        __typename
      }
      total
      limit
      offset
      __typename
    }
    __typename
  }
}
