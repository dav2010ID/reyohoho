fragment MovieRelatedMoviesCount on Movie {
  relatedMoviesCount: relatedMovies(
    limit: 0
    type: [
      VERSION
      SPOOFS
      SPOOFED
      SPIN_OFF
      REFERENCES
      REFERENCES_IN
      EDITED_INTO
      EDITED_FROM
    ]
  ) {
    total
    __typename
  }
  __typename
}

fragment MovieImagesCount on Movie {
  imagesCount: images(types: [STILL, POSTER, WALLPAPER], limit: 0) {
    total
    __typename
  }
  __typename
