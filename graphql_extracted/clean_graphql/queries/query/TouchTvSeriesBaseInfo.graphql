fragment TvSeriesEdisodesCount on TvSeries {
  episodesCount
  __typename
}

fragment MovieOriginalMoviesCount on Movie {
  distribution {
    releases(original: true, types: [DIGITAL], limit: 1) {
      ...OriginalsFragment
      __typename
    }
    __typename
  }
  __typename
}

fragment IsMovieWatchableOnOtt on Movie {
  viewOption {
    isWatchable(filter: { anyDevice: true, anyRegion: false })
    availabilityAnnounce {
      type
      __typename
    }
    __typename
  }
  __typename
}

fragment OgImage on HtmlMeta {
  openGraph {
    image {
      avatarsUrl
      __typename
    }
    __typename
  }
  __typename
}
