query SelectionList(
  $id: String!
  $offset: Int!
  $limit: Int!
  $isAuthorized: Boolean!
) {
  showcase(id: $id) {
    id
    content(offset: $offset, limit: $limit) {
      offset
      limit
      hasMore
      items {
        ... on ExternalMoviesSelection {
          ...ExternalMoviesSelection
          __typename
        }
        __typename
      }
      __typename
    }
    __typename
  }
}

fragment ExternalViewOptionContentBrand on ContentBrand {
  id
  name
  gallery {
    logos {
      colored {
        avatarsUrl
        __typename
      }
      square {
        avatarsUrl
        __typename
      }
      __typename
    }
    __typename
  }
  colors {
    main
    __typename
  }
  userData @include(if: $isAuthorized) {
    isLiked
    __typename
  }
  __typename
}

fragment ExternalViewOptionAction on ExternalPartnerOption {
  action {
    ... on BillingFeaturePurchaseAction {
      purchaseOptionCustomProperties
      __typename
    }
    __typename
  }
  __typename
}

fragment ExternalViewOptions on ExternalViewOption {
  ... on ExternalPartnerOption {
    contentBrand {
      ...ExternalViewOptionContentBrand
      __typename
    }
    ...ExternalViewOptionAction
    externalUrl
    __typename
  }
  ... on ExternalBaseOption {
    contentBrand {
      ...ExternalViewOptionContentBrand
      __typename
    }
    externalUrl
    __typename
  }
  __typename
}

fragment RatingValue on RatingValue {
  value
  isActive
  count
  __typename
}

fragment MovieForPoster on Movie {
  id
  title {
    russian
    original
    __typename
  }
  poster {
    avatarsUrl
    __typename
  }
  genres {
    id
    name
    __typename
  }
  rating {
    kinopoisk {
      ...RatingValue
      __typename
    }
    __typename
  }
  userData @include(if: $isAuthorized) {
    watchStatuses {
      watched {
        value
        __typename
      }
      __typename
    }
    __typename
  }
  viewOption {
    buttonText
    isAvailableOnline: isWatchable(
      filter: { anyDevice: false, anyRegion: false }
    )
    purchasabilityStatus
    contentPackageToBuy {
      billingFeatureName
      __typename
    }
    subscriptionBadge {
      image {
        avatarsUrl
        __typename
      }
      __typename
    }
    type
    posterWithRightholderLogo
    __typename
  }
  ... on Film {
    productionYear
    __typename
  }
  ... on Video {
    productionYear
    __typename
  }
  ... on TvSeries {
    releaseYears {
      start
      end
      __typename
    }
    __typename
  }
  ... on TvShow {
    releaseYears {
      start
      end
      __typename
    }
    __typename
  }
  ... on MiniSeries {
    releaseYears {
      start
      end
      __typename
    }
    __typename
  }
  __typename
}

fragment ExternalMovieSelectionItem on ExternalMovieSelectionItem {
  movie {
    externalViewOptions {
      ...ExternalViewOptions
      __typename
    }
    ...MovieForPoster
    __typename
  }
  __typename
}

fragment ExternalMoviesSelection on ExternalMoviesSelection {
  id
  title
  comment
  content(offset: 0, limit: 20) {
    hasMore
    items {
      ... on ExternalMovieSelectionItem {
        ...ExternalMovieSelectionItem
        __typename
      }
      __typename
    }
    __typename
  }
  __typename
}
