query PersonOnlineFilms($personId: Long!, $onlineFilmsLimit: Int = 10) {
  person(id: $personId) {
    id
    filmographyRelations(isOnline: true, limit: $onlineFilmsLimit) {
      items {
        movie {
          id
          title {
            russian
            original
            __typename
          }
          countries {
            id
            name
            __typename
          }
          ... on Film {
            productionYear
            __typename
          }
          ... on TvSeries {
            releaseYears {
              start
              end
              __typename
            }
            __typename
          }
          ... on MiniSeries {
            releaseYears {
              start
              end
              __typename
            }
            __typename
          }
          ... on TvShow {
            releaseYears {
              start
              end
              __typename
            }
            __typename
          }
          ... on Video {
            productionYear
            __typename
          }
          poster {
            avatarsUrl
            __typename
          }
          genres {
            id
            name
            __typename
          }
          rating {
            kinopoisk {
              ...RatingValue
              __typename
            }
            __typename
          }
          viewOption {
            buttonText
            isAvailableOnline: isWatchable(
              filter: { anyDevice: false, anyRegion: false }
            )
            purchasabilityStatus
            contentPackageToBuy {
              billingFeatureName
              __typename
            }
            subscriptionBadge {
              image {
                avatarsUrl
                __typename
              }
              __typename
            }
            type
            posterWithRightholderLogo
            __typename
          }
          __typename
        }
        __typename
      }
      total
      __typename
    }
    __typename
  }
}

fragment RatingValue on RatingValue {
  value
  isActive
  count
  __typename
}
