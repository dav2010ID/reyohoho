query MovieDetailsMobileUserPlannedToWatchByOttId($contentUuid: String!) {
  movieByContentUuid(contentUuid: $contentUuid) {
    __typename
    ...movieDetailsMobileUserPlannedToWatchFragment
  }
}

fragment movieDetailsMobileUserPlannedToWatchFragment on Movie {
  userData {
    isPlannedToWatch
  }
}
