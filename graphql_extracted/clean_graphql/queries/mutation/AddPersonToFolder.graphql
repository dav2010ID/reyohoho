mutation AddPersonToFolder($personId: Long!, $folderId: Long!) {
  person {
    folder {
      item {
        add(input: { personId: $personId, folderTypeId: $folderId }) {
          status
          error {
            message
            __typename
          }
          __typename
        }
        __typename
      }
      __typename
    }
    __typename
  }
}
