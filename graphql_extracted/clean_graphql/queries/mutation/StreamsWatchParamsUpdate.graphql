mutation StreamsWatchParamsUpdate(
  $contentId: String!
  $audioLanguage: String!
  $subtitlesLanguage: String
) {
  watchParams {
    save(
      input: {
        contentId: $contentId
        audioLanguage: $audioLanguage
        subtitleLanguage: $subtitlesLanguage
      }
    ) {
      status
      error {
        message
      }
    }
  }
}
