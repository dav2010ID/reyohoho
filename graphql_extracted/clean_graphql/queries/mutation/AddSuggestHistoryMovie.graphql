mutation AddSuggestHistoryMovie($id: Long!) {
  emptyPrefixSuggest {
    history {
      add {
        movie(input: { id: $id }) {
          ...SuggestHistoryResponse
          __typename
        }
        __typename
      }
      __typename
    }
    __typename
  }
}

fragment SuggestHistoryResponse on EmptyPrefixSuggestHistoryPayload {
  error {
    message
    __typename
  }
  status
  __typename
}
