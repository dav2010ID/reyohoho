mutation MovieSetPlannedToWatch($movieId: Long!, $plannedToWatch: Boolean!) {
  movie {
    plannedToWatch {
      set(input: { movieId: $movieId }) @include(if: $plannedToWatch) {
        status
        error {
          message
        }
      }
      remove(input: { movieId: $movieId }) @skip(if: $plannedToWatch) {
        status
        error {
          message
        }
      }
    }
  }
}
