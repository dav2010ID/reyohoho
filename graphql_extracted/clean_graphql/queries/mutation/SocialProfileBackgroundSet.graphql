mutation SocialProfileBackgroundSet(
  $input: SetProfilePreparedBackgroundInput!
) {
  userProfile {
    social {
      setPreparedBackground(input: $input) {
        __typename
        ...socialProfileBackgroundMutationPayloadFragment
      }
    }
  }
}

fragment socialProfileBackgroundMutationPayloadFragment on UserSocialBackgroundMutationPayload {
  status
  errors {
    __typename
    message
  }
}
