        if (w.loadReyohohoAnalytics) return

        var loaded = false
        var disabledHosts = ['localhost', '127.0.0.1', '0.0.0.0', '::1', '[::1]']
        w[l] = w[l] || []

        w.loadReyohohoAnalytics = function () {
          var authCallback = /\/auth-success\/?$/.test(w.location.pathname)
          var localHost =
            disabledHosts.includes(w.location.hostname) ||
            w.location.hostname.endsWith('.localhost')
          if (loaded || authCallback || localHost) return false

          loaded = true
          // Initialize the container before it replays events queued during the delay.
          w[l].unshift({ 'gtm.start': new Date().getTime(), event: 'gtm.js' })
          var f = d.getElementsByTagName(s)[0],
            j = d.createElement(s),
            dl = l != 'dataLayer' ? '&l=' + l : ''
          j.async = true
          j.src = 'https://www.googletagmanager.com/gtm.js?id=' + i + dl
          f.parentNode.insertBefore(j, f)
          return true
        }
      })(window, document, 'script', 'dataLayer', 'GTM-NVWTCVZH')
    </script>

    <script>
      ;(() => {
        const baseUrl = '%BASE_URL%'
        const normalizedBase = baseUrl.endsWith('/') ? baseUrl.slice(0, -1) : baseUrl
        const currentUrl = new URL(window.location.href)
        const redirectPath = currentUrl.searchParams.get('p')

        if (!redirectPath) {
          return
        }

        const restoredPath = decodeURIComponent(redirectPath)
        const remainingParams = new URLSearchParams(currentUrl.searchParams)
        remainingParams.delete('p')

        const searchSuffix = remainingParams.toString()
        const nextUrl = `${normalizedBase}${restoredPath}${searchSuffix ? `?${searchSuffix}` : ''}`

        window.history.replaceState(null, '', nextUrl)
      })()
    </script>

  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
    <script>
      ;(() => {
        if (window.loadReyohohoGoatCounter) return
        let loaded = false

        window.loadReyohohoGoatCounter = () => {
          const hostname = window.location.hostname
          const isLocalhost =
            ['localhost', '127.0.0.1', '0.0.0.0', '::1', '[::1]'].includes(hostname) ||
            hostname.endsWith('.localhost')
          if (loaded || isLocalhost || /\/auth-success\/?$/.test(window.location.pathname)) {
            return false
          }

          loaded = true
          window.goatcounter = window.goatcounter || {}
          window.goatcounter.no_onload = true

          const script = document.createElement('script')
          script.dataset.goatcounter = 'https://reyohoho.goatcounter.com/count'
          script.async = true
          script.src = '%BASE_URL%goatcounter/count.v5.js'
          script.onload = () => {
            script.onload = null
            window.goatcounter.reyohohoFlush?.()
          }
          document.body.appendChild(script)
          return true
        }
      })()
    </script>
