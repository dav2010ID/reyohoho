name: Deploy-GH

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - name: Generate weekly SEO catalog and sitemap
        if: github.event_name == 'schedule'
        run: yarn seo:prepare
      - name: Check last successful SEO refresh
        run: node scripts/fetch-seo-data.js --check-freshness
      - name: Build site
        run: yarn build:github
        env:
          VITE_PRERENDER_MOVIE_PAGES: 'true'
          VITE_WORKER_AUTH_ENABLED: ${{ vars.VITE_WORKER_AUTH_ENABLED || 'false' }}
          VITE_CLOUD_HISTORY_ENABLED: ${{ vars.VITE_CLOUD_HISTORY_ENABLED || 'false' }}
      - name: Prepare pinned Worker vendor modules
        run: node workers/kinobox-search/prepare-vendor.mjs
      - name: Validate the checkout used to build this artifact
        run: |
          yarn lint
          yarn check:encoding
          yarn test:unit --run
          node scripts/check-seo-pages.js dist
      - name: Install browser for artifact verification
        run: yarn playwright install --with-deps chromium
      - name: Verify SSG and offline navigation in the final artifact
        run: node scripts/browser-artifact-check.js dist
      - name: Commit verified weekly SEO updates
        if: github.event_name == 'schedule'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/movies.json src/data/seo-refresh.json public/sitemap.xml public/robots.txt
          if ! git diff --cached --quiet; then
            git commit -m "chore: update weekly SEO assets [skip ci]"
            git push
          fi
      - name: Record the revision of the verified artifact
        run: git rev-parse HEAD > dist/build-sha.txt

      - uses: actions/upload-artifact@v4
        with:
          name: production-files
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: production-files
          path: dist

      - uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          cname: reyhoho.fun
