name: Deploy-GH

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - name: Generate weekly SEO catalog and sitemap
        if: github.event_name == 'schedule'
        run: yarn seo:prepare
      - name: Commit weekly SEO updates
        if: github.event_name == 'schedule'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/movies.json public/sitemap.xml public/robots.txt
          if git diff --cached --quiet; then
            echo "No SEO changes to commit"
          else
            git commit -m "chore: update weekly SEO assets [skip ci]"
            git push
          fi
      - name: Build site
        run: yarn build:github
        env:
          VITE_PRERENDER_MOVIE_PAGES: ${{ github.event_name == 'schedule' && 'true' || 'false' }}

      - uses: actions/upload-artifact@v4
        with:
          name: production-files
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: production-files
          path: dist

      - uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
