name: Deploy-GH

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - name: Generate weekly SEO catalog and sitemap
        if: github.event_name == 'schedule'
        run: yarn seo:prepare
      - name: Build site
        run: yarn build:github
        env:
          VITE_PRERENDER_MOVIE_PAGES: ${{ github.event_name == 'schedule' && 'true' || 'false' }}

      - uses: actions/upload-artifact@v4
        with:
          name: production-files
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: production-files
          path: dist

      - uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
