name: Deploy-GH

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      allow_stale_seo:
        description: 'Emergency release: ship the last verified SEO snapshot even if it is older than 14 days'
        type: boolean
        default: false

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    # Playwright 1.59 has no Chromium build for ubuntu-latest (26.04); the artifact
    # check below needs it. Raise this together with the Playwright version.
    runs-on: ubuntu-24.04
    env:
      # One value for the build and the live check: the artifact must be checked
      # against the Worker it will call.
      WORKER_API_URL: ${{ vars.VITE_WORKER_API_URL || 'https://api.reyhoho.fun' }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: yarn

      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - name: Generate weekly SEO catalog and sitemap
        if: github.event_name == 'schedule'
        run: yarn seo:prepare
      - name: Check last successful SEO refresh
        run: node scripts/fetch-seo-data.js --check-freshness
        env:
          ALLOW_STALE_SEO: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_stale_seo && 'true' || 'false' }}
      - name: Validate the checkout used to build this artifact
        run: |
          yarn lint
          yarn check:encoding
          yarn check:release
          yarn test:unit --run
      - name: Build site
        run: yarn build:github
        env:
          VITE_PRERENDER_MOVIE_PAGES: 'true'
          VITE_WORKER_AUTH_ENABLED: ${{ vars.VITE_WORKER_AUTH_ENABLED || 'false' }}
          VITE_CLOUD_HISTORY_ENABLED: ${{ vars.VITE_CLOUD_HISTORY_ENABLED || 'false' }}
          VITE_PLAYER_IFRAME_SANDBOX: ${{ vars.VITE_PLAYER_IFRAME_SANDBOX || 'false' }}
          VITE_PLAYER_SANDBOX_ORIGINS: ${{ vars.VITE_PLAYER_SANDBOX_ORIGINS || '' }}
          VITE_WORKER_API_URL: ${{ env.WORKER_API_URL }}
      - name: Verify prerendered pages
        run: node scripts/check-seo-pages.js dist
      - name: Install browser for artifact verification
        run: yarn playwright install --with-deps chromium
      - name: Verify SSG and offline navigation in the final artifact
        run: node scripts/browser-artifact-check.js dist
      - name: Commit verified weekly SEO updates
        if: github.event_name == 'schedule'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/movies.json src/data/seo-refresh.json public/sitemap.xml public/robots.txt
          if ! git diff --cached --quiet; then
            git commit -m "chore: update weekly SEO assets [skip ci]"
            git push
          fi
      # Site last: the live D1 migration and API Worker must already match release.json.
      - name: Check that the live API Worker is ready for this site
        run: node scripts/check-release.mjs --live "$WORKER_API_URL"
      - name: Record the revision of the verified artifact
        run: git rev-parse HEAD > dist/build-sha.txt

      # site-meta.json belongs to this build: the site Worker bundles it next to dist.
      # Hidden files are needed for dist/.assetsignore.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-files
          include-hidden-files: true
          path: |
            dist
            workers/site/generated/site-meta.json

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: production-files

      # Still deployed after the switch: the rollback target (docs/cloudflare-site.md).
      - uses: peaceiris/actions-gh-pages@329bcc8f12caed2cefe5a5b80781499a6f3b361b # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          cname: reyhoho.fun

  # vars.SITE_TARGET: unset = GitHub Pages only; "preview" = also the site Worker on
  # workers.dev; "cloudflare" = the site Worker serves reyhoho.fun. See docs/cloudflare-site.md.
  deploy-worker:
    needs: build
    if: vars.SITE_TARGET == 'preview' || vars.SITE_TARGET == 'cloudflare'
    runs-on: ubuntu-latest
    env:
      SITE_TARGET: ${{ vars.SITE_TARGET }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: yarn

      - run: corepack enable
      - run: yarn install --frozen-lockfile

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: production-files

      - name: Deploy the site Worker
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          domain=()
          if [ "$SITE_TARGET" = cloudflare ]; then domain=(--domain reyhoho.fun); fi
          npx wrangler deploy --config workers/site/wrangler.jsonc "${domain[@]}" \
            --message "$(cat dist/build-sha.txt)" | tee "$RUNNER_TEMP/deploy.log"
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' "$RUNNER_TEMP/deploy.log" | head -n 1)
          echo "workers_dev=$url" >> "$GITHUB_OUTPUT"

      - name: Check the deployed site
        env:
          WORKERS_DEV: ${{ steps.deploy.outputs.workers_dev }}
        run: |
          if [ "$SITE_TARGET" = cloudflare ]; then base=https://reyhoho.fun; www=--www
          else base=$WORKERS_DEV; www=; fi
          # A first workers.dev deploy can answer 523 for a minute while its DNS appears.
          for _ in $(seq 1 24); do curl -fsS -o /dev/null "$base/" && break; sleep 5; done
          node scripts/check-site.mjs "$base" $www
