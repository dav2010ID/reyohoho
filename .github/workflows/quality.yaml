name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: yarn
      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: yarn check:encoding
      - run: yarn check:release
      - run: yarn test:unit --run
      - run: yarn build
      # Catches import and bundling errors that unit tests (Node, not workerd) miss.
      - name: Bundle both Workers without deploying
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: |
          npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/api" --config workers/kinobox-search/wrangler.jsonc
          npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/site" --config workers/site/wrangler.jsonc

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: ruff check backend
      - run: python -m compileall -q backend
      - run: python -m pytest -q
